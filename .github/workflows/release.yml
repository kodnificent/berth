name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # GoReleaser reads the tags to find the previous release.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  install:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      BERTH_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os != 'Windows'
        run: |
          BERTH_INSTALL_DIR="$RUNNER_TEMP/bin" sh site/public/install
          test "$("$RUNNER_TEMP/bin/berth" --version)" = "berth ${BERTH_VERSION#v}"
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:BERTH_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'bin'
          Get-Content -Raw site/public/install.ps1 | Invoke-Expression
          $got = & (Join-Path $env:BERTH_INSTALL_DIR 'berth.exe') --version
          if ($got -ne "berth $($env:BERTH_VERSION.TrimStart('v'))") { throw "installed $got" }
