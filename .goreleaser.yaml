version: 2

project_name: berth

builds:
  - main: ./cmd/berth
    binary: berth
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  # No version in the name, so releases/latest/download/<name> always points at the
  # newest one and the install scripts need no API call to find it.
  - name_template: "berth_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

release:
  prerelease: auto

changelog:
  use: github-native
