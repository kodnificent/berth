name: berthfixture

services:
  web:
    build: ./web
    ports:
      - "${WEB_PORT:-18080}:80"
    volumes:
      - cache:/cache
    depends_on:
      search:
        condition: service_healthy
      db:
        condition: service_healthy

  # Listens on the same port inside the container as it publishes, and its healthcheck
  # reads that port from the variable, so remapping the variable would break it.
  search:
    image: busybox:1.36.1
    environment:
      SEARCH_PORT: ${SEARCH_PORT:-17700}
    command: ["sh", "-c", "mkdir -p /www && echo ok > /www/index.html && exec httpd -f -p $$SEARCH_PORT -h /www"]
    ports:
      - "${SEARCH_PORT:-17700}:${SEARCH_PORT:-17700}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$$SEARCH_PORT/"]
      interval: 1s
      timeout: 2s
      retries: 30

  db:
    image: mysql:8.4.4
    environment:
      MYSQL_ROOT_PASSWORD: fixture
      MYSQL_DATABASE: app
    ports:
      - "${DB_PORT:-13306}:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pfixture"]
      interval: 2s
      timeout: 5s
      retries: 60

volumes:
  db-data:
  cache:
